<!doctype HTML>
<html>
<head>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<title>practice game</title>
</head>
<body>
    <h1><span id="title">QUESTION GAME</span></h1>
    <div class="quiz-container">
       <h3><span id="subtitle">questions and answers</span></h3>
       <button id="btn-idioma" class="quiz-btn" onclick="cambiarIdioma()" style="margin-bottom: 15px; width: 90%; max-width: 200px;">🇦🇷 Switch to spanish</button>
    <div id="panel-info">
        <span id="cantidad-vidas">❤️ hearts:3</span>
        <span id="numero-preguntas">🤔questions:1/10</span>
    </div>    
<p id="pregunta">How many months are in a year?</p>

<button class="quiz-btn" onclick="verificarRespuesta('incorrecta',this)">
    <span class="respuesta">10 months</span>
</button>

<button class="quiz-btn" onclick="verificarRespuesta('correcta',this)">
    <span class="respuesta">12 months</span>
</button>

<button class="quiz-btn" onclick="verificarRespuesta('incorrecta',this)">
    <span class="respuesta">11 months</span>
</button>

        
        <p id="resultado-quiz"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
